<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#000500"/>
    </linearGradient>
    <filter id="glowD">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff41"/>
      <stop offset="50%" style="stop-color:#00cc33"/>
      <stop offset="100%" style="stop-color:#00ff41"/>
    </linearGradient>
  </defs>
  <!-- BG -->
  <rect width="100" height="100" fill="url(#bg)" rx="14"/>
  <rect x="2" y="2" width="96" height="96" rx="12" fill="none" stroke="#00ff41" stroke-width="0.8" opacity="0.12"/>
  
  <!-- Grid -->
  <g stroke="#00ff41" stroke-width="0.2" opacity="0.06">
    <line x1="0" y1="25" x2="100" y2="25"/><line x1="0" y1="50" x2="100" y2="50"/>
    <line x1="0" y1="75" x2="100" y2="75"/><line x1="25" y1="0" x2="25" y2="100"/>
    <line x1="50" y1="0" x2="50" y2="100"/><line x1="75" y1="0" x2="75" y2="100"/>
  </g>

  <!-- Matrix rain chars -->
  <g font-family="monospace" font-size="5" fill="#00ff41" opacity="0.15">
    <text x="6" y="92">ﾀﾗ</text>
    <text x="88" y="18">ﾛﾞ</text>
    <text x="15" y="10">1ﾌ</text>
    <text x="80" y="85">0x1</text>
  </g>
  <g font-family="monospace" font-size="4" fill="#00ff41" opacity="0.08">
    <text x="3" y="48">0110</text>
    <text x="78" y="52">1001</text>
  </g>

  <!-- Terminal prompt line above D -->
  <text x="28" y="26" font-family="monospace" font-size="6" fill="#00cc33" opacity="0.4">d4r1an@site</text>

  <!-- Large D letter -->
  <text x="12" y="76" font-family="monospace" font-size="72" font-weight="bold" fill="url(#dGrad)" filter="url(#glowD)">D</text>
  
  <!-- Blinking cursor after D -->
  <rect x="76" y="35" width="14" height="45" rx="2" fill="#00ff41" filter="url(#glowSoft)" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0;0.3" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
