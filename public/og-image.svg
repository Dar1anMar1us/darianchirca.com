<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#050508"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid -->
  <g stroke="#00ff41" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  <!-- Matrix drops -->
  <text x="100" y="-50" fill="#00ff41" opacity="0.15" font-family="monospace" font-size="24">ﾄﾛｾｺﾞﾆｻﾊﾏｶ</text>
  <text x="300" y="-30" fill="#00ff41" opacity="0.1" font-family="monospace" font-size="20">ﾊﾐｻﾏﾇﾆﾁ</text>
  <!-- Terminal line -->
  <text x="60" y="120" fill="#6b7280" font-family="monospace" font-size="22">d4r1an@site:~$</text>
  <text x="320" y="120" fill="#00ff41" font-family="monospace" font-size="22" filter="url(#glow)"> ./start.sh --profile</text>
  <!-- Main title -->
  <text x="60" y="220" fill="#6b7280" font-family="monospace" font-size="60" font-weight="bold">D4r1an</text>
  <text x="270" y="220" fill="#00ff41" font-family="monospace" font-size="60" font-weight="bold" filter="url(#glow)">.</text>
  <text x="60" y="320" fill="#00ff41" font-family="monospace" font-size="80" font-weight="bold" filter="url(#glow)">Ethical Hacker</text>
  <text x="60" y="420" fill="#e0e0e0" font-family="monospace" font-size="60" font-weight="bold">&amp; Developer</text>
  <!-- Subtitle -->
  <text x="60" y="500" fill="#6b7280" font-family="monospace" font-size="24">Pentesting • AI Agents • QA Automation • Full Stack</text>
  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="#00ff41" opacity="0.05"/>
  <text x="60" y="610" fill="#00cc33" font-family="monospace" font-size="16">darianchirca.com</text>
  <text x="900" y="610" fill="#6b7280" font-family="monospace" font-size="14">#built-from-scratch</text>
  <!-- Cursor blink -->
  <rect x="790" y="100" width="6" height="30" rx="1" fill="#00ff41" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
